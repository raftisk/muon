name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy muon
      - name: Parse the ontology files
        run: uv run python -c "import glob, rdflib; [rdflib.Graph().parse(p) for p in glob.glob('ontology/**/*.ttl', recursive=True)]"
      - name: Check the SHACL shapes
        run: |
          for shapes in ontology/shapes/*.shacl.ttl; do
            uv run pyshacl --metashacl --advanced --shacl "$shapes" --data-file-format turtle /dev/null || exit 1
          done
      - name: Run the unit tests
        run: uv run pytest
