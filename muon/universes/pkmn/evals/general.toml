# Eval questions for `muon eval pkmn`, from easy to hard.
#
# A gold query returns the nodes the answer rests on: the anchor nodes and the answer
# nodes, never join nodes. Each one comes from the runbook entry named in `runbook`.

[[question]]
id = "Q01"
family = "S1"
question = "What type is Diglett?"
reference = "Diglett is a Ground type."
runbook = "R05"
gold_query = """
MATCH (s:PokemonSpecies {id: 'diglett'})-[:HAS_TYPE]->(t:Type)
RETURN s, t
"""

[[question]]
id = "Q02"
family = "S1"
question = "What are the power, accuracy and type of Earthquake?"
reference = "Earthquake has power 100 and accuracy 100, and it is a Ground-type Physical move."
runbook = "R16"
gold_query = """
MATCH (m:Move {id: 'earthquake'})-[:HAS_TYPE]->(t:Type)
RETURN m, t
"""

[[question]]
id = "Q03"
family = "S1"
question = "What are Diglett's base stats?"
reference = "Diglett has base HP 10, Attack 55, Defense 25, Sp. Atk 35, Sp. Def 45 and Speed 95."
runbook = "R05"
gold_query = """
MATCH (s:PokemonSpecies {id: 'diglett'})
RETURN s
"""

[[question]]
id = "Q04"
family = "S1"
question = "What abilities does Greninja have, and what do they do?"
reference = """Greninja has Torrent, which strengthens Water moves by 1.5 times at 1/3 max HP or \
less, and the hidden ability Protean, which changes the bearer's type to match each move it uses."""
runbook = "R32"
gold_query = """
MATCH (s:PokemonSpecies {id: 'greninja'})-[:HAS_ABILITY]->(a:Ability)
RETURN s, a
"""

[[question]]
id = "Q05"
family = "S2"
question = "Which Pokémon have the ability Levitate?"
reference = """43 species have Levitate, from Azelf, Baltoy and Bronzong on. None of them has it as \
a hidden ability."""
runbook = "R13"
gold_query = """
MATCH (s:PokemonSpecies)-[:HAS_ABILITY]->(a:Ability {id: 'levitate'})
RETURN DISTINCT s, a
"""

[[question]]
id = "Q06"
family = "S2"
question = "Which sound moves have a power of 90 or more?"
reference = """6 sound moves: Boomburst 140, Clanging Scales 110, Bug Buzz 90, Hyper Voice 90, \
Sparkling Aria 90 and Uproar 90."""
runbook = "R18"
gold_query = """
MATCH (m:Move)-[:HAS_FLAG]->(f:MoveFlag {id: 'sound'})
WHERE m.power >= 90
RETURN m, f
"""

[[question]]
id = "Q07"
family = "S2"
question = "Which Pokémon are both Water and Ground type?"
reference = """10 species: Wooper, Quagsire, Marshtomp, Mega Swampert, Swampert, Barboach, \
Whiscash, Gastrodon, Palpitoad and Seismitoad."""
runbook = "R11"
gold_query = """
MATCH (s:PokemonSpecies)-[:HAS_TYPE]->(water:Type {id: 'water'}),
  (s)-[:HAS_TYPE]->(ground:Type {id: 'ground'})
RETURN s, water, ground
"""

[[question]]
id = "Q08"
family = "S3"
question = "What are the 10 fastest Pokémon?"
reference = """Regieleki 200, Deoxys (Speed Forme) 180, Ninjask 160, Mega Zeraora 153, Mega Absol Z \
151, Mega Garchomp Z 151, Mega Lucario Z 151, Pheromosa 151, Calyrex (Shadow Rider) 150 and Deoxys \
150. Forms count as species."""
runbook = "R14"
gold_query = """
MATCH (s:PokemonSpecies)
RETURN s
ORDER BY s.baseSpeed DESC, s.name
LIMIT 10
"""

[[question]]
id = "Q09"
family = "S3"
question = "How many moves were introduced in Generation IX?"
reference = "70 moves were introduced in Generation IX."
runbook = "R22"
gold_query = """
MATCH (g:Generation {id: 'generation-ix'})
RETURN g
"""

[[question]]
id = "Q10"
family = "S3"
question = "Which moves hit more than once, and which one hits the most times?"
reference = """32 moves hit more than once. Population Bomb hits up to 10 times and Beat Up up to \
6. The others hit 2 to 5 times, such as Arm Thrust, Barrage, Bone Rush and Bullet Seed."""
runbook = "R20"
gold_query = """
MATCH (m:Move)
WHERE m.minHits IS NOT NULL
RETURN m
"""

[[question]]
id = "Q11"
family = "S2"
question = "Which Legendary Pokémon were introduced in Generation IV?"
reference = """9 species: Uxie, Mesprit, Azelf, Dialga, Palkia, Heatran, Regigigas, Giratina and \
Cresselia."""
runbook = "R15"
gold_query = """
MATCH (s:PokemonSpecies {isLegendary: true})-[:INTRODUCED_IN]->(g:Generation {id: 'generation-iv'})
RETURN s, g
"""

[[question]]
id = "Q12"
family = "S5"
question = "Which TMs can Garchomp learn in Scarlet and Violet?"
reference = """Garchomp learns 56 TMs in Scarlet and Violet, from TM1 Take Down, TM6 Scary Face and \
TM7 Protect to TM226."""
runbook = "R10"
gold_query = """
MATCH (s:PokemonSpecies {id: 'garchomp'})-[:HAS_LEARNSET_ENTRY]->(e:LearnsetEntry {method: 'machine'}),
  (e)-[:IN_VERSION_GROUP]->(:VersionGroup {id: 'scarlet-violet'}),
  (e)-[:VIA_MACHINE]->(x:Machine)
RETURN DISTINCT s, x
"""

[[question]]
id = "Q13"
family = "S5"
question = "What does Pikachu learn by leveling up in Scarlet and Violet?"
reference = """20 moves. Charm, Growl, Nasty Plot, Nuzzle, Play Nice, Quick Attack, Sweet Kiss and \
Tail Whip at level 1, up to Thunderbolt at level 36, Light Screen at 40 and Thunder at 44."""
runbook = "R09"
gold_query = """
MATCH (s:PokemonSpecies {id: 'pikachu'})-[:HAS_LEARNSET_ENTRY]->(e:LearnsetEntry {method: 'level'}),
  (e)-[:IN_VERSION_GROUP]->(:VersionGroup {id: 'scarlet-violet'}),
  (e)-[:TEACHES_MOVE]->(m:Move)
RETURN DISTINCT s, m
"""

[[question]]
id = "Q14"
family = "S5"
question = "Where can I find Diglett in HeartGold?"
reference = """5 locations: Diglett's Cave, Johto Route 48 and Johto Safari Zone, Pal Park (a \
migration, with no method) and Vermilion City (with Rock Smash)."""
runbook = "R33"
gold_query = """
MATCH (s:PokemonSpecies {id: 'diglett'})-[:HAS_ENCOUNTER]->(e:Encounter)-[:IN_VERSION]->(v:Version {id: 'heartgold'}),
  (e)-[:AT_LOCATION]->(l:Location)
RETURN DISTINCT s, v, l
"""

[[question]]
id = "Q15"
family = "S5"
question = "Which Pokémon can be found in Mt. Coronet?"
reference = """29 species, from Abomasnow to Zubat, including Bronzor, Feebas, Nosepass and Snover. \
The graph names the location Mount Coronet."""
runbook = "R34"
gold_query = """
MATCH (s:PokemonSpecies)-[:FOUND_IN]->(l:Location {id: 'mount-coronet'})
RETURN DISTINCT s, l
"""

[[question]]
id = "Q16"
family = "S6"
question = "Which Pokémon take 4 times damage from Ice-type moves?"
reference = """40 species, among them Alolan Exeggutor (Dragon and Grass), Altaria (Dragon and \
Flying) and Appletun (Dragon and Grass). The count reads types only, so abilities such as Thick \
Fat and Tera types are not counted."""
runbook = "R12"
gold_query = """
MATCH (ice:Type {id: 'ice'})-[:SUPER_EFFECTIVE_AGAINST]->(t:Type)<-[:HAS_TYPE]-(s:PokemonSpecies)
WITH ice, s, count(t) AS weak_count
WHERE weak_count = 2
RETURN s, ice
"""

[[question]]
id = "Q17"
family = "S7"
question = "How does Oddish's evolution family evolve?"
reference = """Oddish evolves into Gloom at level 21. Gloom evolves into Vileplume with a Leaf Stone \
and into Bellossom with a Sun Stone."""
runbook = "R07"
gold_query = """
MATCH (:PokemonSpecies {id: 'oddish'})-[:EVOLVES_TO*0..]->(s:PokemonSpecies)
OPTIONAL MATCH (s)<-[:FROM_SPECIES]-(:Evolution)-[:REQUIRES]->(requirement)
RETURN DISTINCT s, requirement
"""

[[question]]
id = "Q18"
family = "S7"
question = "How does Charizard Mega Evolve?"
reference = """Charizard Mega Evolves into Mega Charizard X while it holds Charizardite X, and into \
Mega Charizard Y while it holds Charizardite Y. The graph holds no Gigantamax or Terastal form \
change."""
runbook = "R08"
gold_query = """
MATCH (c:PokemonSpecies {id: 'charizard'})<-[:FROM_SPECIES]-(f:FormChange)-[:TO_SPECIES]->(form:PokemonSpecies)
OPTIONAL MATCH (f)-[:REQUIRES]->(requirement)
RETURN DISTINCT c, form, requirement
"""

[[question]]
id = "Q19"
family = "S9"
question = "What do the Pokédex entries say about Diglett?"
reference = """18 distinct entries cover 36 versions. The most shared one, "A Pokémon that lives \
underground...", covers Black, Black 2, Diamond, Pearl, Platinum, White and more."""
runbook = "R28"
gold_query = """
MATCH (c:TextChunk {aspect: 'pokedex'})-[:DESCRIBES]->(s:PokemonSpecies {id: 'diglett'})
RETURN s, c
"""

[[question]]
id = "Q20"
family = "S9"
question = "How is the effect of Natural Cure described across generations?"
reference = """The graph holds 5 effect texts for Natural Cure, split by section: Generation III, \
Generations IV to VII, Generation VIII onward and Outside of battle."""
runbook = "R31"
gold_query = """
MATCH (a:Ability {id: 'natural-cure'})<-[:DESCRIBES]-(c:TextChunk {aspect: 'effect'})
RETURN a, c
"""

[[question]]
id = "Q21"
family = "S11"
question = "Which is faster, Garchomp or Dragonite?"
reference = "Garchomp is faster, with base Speed 102 against 80 for Dragonite."
gold_query = """
MATCH (s:PokemonSpecies)
WHERE s.id IN ['garchomp', 'dragonite']
RETURN s
"""

[[question]]
id = "Q22"
family = "S11"
question = "Compare Earthquake and Bulldoze: power, accuracy and type."
reference = """Earthquake has power 100 and Bulldoze power 60. Both have accuracy 100 and both are \
Ground-type Physical moves."""
gold_query = """
MATCH (m:Move)-[:HAS_TYPE]->(t:Type)
WHERE m.id IN ['earthquake', 'bulldoze']
RETURN DISTINCT m, t
"""

[[question]]
id = "Q23"
family = "S18"
question = "At what level does Raichu evolve into Pikachu?"
reference = """The premise is reversed. Raichu does not evolve into Pikachu. Pichu evolves into \
Pikachu through friendship, and Pikachu evolves into Raichu with a Thunder Stone, at no level."""
gold_query = """
MATCH (s:PokemonSpecies)
WHERE s.id IN ['pikachu', 'raichu']
RETURN s
"""

[[question]]
id = "Q24"
family = "S5"
question = "Which Pokémon appear at Mt. Moon in the Generation I games?"
reference = """5 species: Clefairy, Geodude, Paras, Sandshrew and Zubat. Without the generation \
filter the location holds 13 species."""
runbook = "R35"
gold_query = """
MATCH (s:PokemonSpecies)-[:HAS_ENCOUNTER]->(e:Encounter)-[:AT_LOCATION]->(:Location)
  -[:LOCATED_IN*0..1]->(l:Location {id: 'mt-moon'}),
  (e)-[:IN_VERSION]->(:Version)-[:PART_OF*]->(g:Generation {id: 'generation-i'})
RETURN DISTINCT s, l, g
"""

[[question]]
id = "Q25"
family = "S4"
question = "Which Pokémon learn both Stealth Rock and U-turn?"
reference = """22 species: Annihilape, Azelf, Bombirdier, Chimchar, Flygon, Galarian Meowth, \
Gligar, Gliscor, Hydreigon, Infernape, Jirachi, Kleavor, Landorus, Mesprit, Mew, Minior, Monferno, \
Perrserker, Primeape, Rayquaza, Uxie and Vibrava."""
runbook = "R23"
gold_query = """
MATCH (s:PokemonSpecies)-[:CAN_LEARN]->(rock:Move {id: 'stealth-rock'}),
  (s)-[:CAN_LEARN]->(turn:Move {id: 'u-turn'})
RETURN s, rock, turn
"""

[[question]]
id = "Q26"
family = "S4"
question = "Which moves can only Ogerpon learn?"
reference = "Ivy Cudgel is the only move that Ogerpon learns and no other species does."
runbook = "R25"
gold_query = """
MATCH (s:PokemonSpecies {id: 'ogerpon'})-[:CAN_LEARN]->(m:Move)
WHERE NOT EXISTS {
  MATCH (m)<-[:CAN_LEARN]-(o:PokemonSpecies)
  WHERE o <> s AND NOT (s)-[:HAS_FORM]-(o)
}
RETURN s, m
"""

[[question]]
id = "Q27"
family = "S4"
question = "Which Fire moves of power 100 or more do non-Fire Pokémon learn, and how many Pokémon learn each?"
reference = """Fire Blast 110 (80 learners), Overheat 130 (19), Flare Blitz 120 (7), Blast Burn 150 \
(Mew only), Eruption 150 (Groudon only) and Fusion Flare 100 (White Kyurem only)."""
runbook = "R26"
gold_query = """
MATCH (m:Move)-[:HAS_TYPE]->(:Type {id: 'fire'})
WHERE m.power >= 100
MATCH (s:PokemonSpecies)-[:CAN_LEARN]->(m)
WHERE NOT (s)-[:HAS_TYPE]->(:Type {id: 'fire'})
RETURN DISTINCT m, s
"""

[[question]]
id = "Q28"
family = "S4"
question = "Which Water-type Pokémon evolve from a Pokémon that learns Surf?"
reference = """52 Water-type species evolve from 48 species that learn Surf, so the answer is a long \
list."""
runbook = "R24"
gold_query = """
MATCH (surf:Move {id: 'surf'})<-[:CAN_LEARN]-(a:PokemonSpecies)-[:EVOLVES_TO]->(b:PokemonSpecies)-[:HAS_TYPE]->(water:Type {id: 'water'})
RETURN DISTINCT surf, a, b, water
"""

[[question]]
id = "Q29"
family = "S4, S5"
question = "Which Pokémon found at Mt. Moon in the Generation I games can learn Stealth Rock?"
reference = "Clefairy, Geodude and Sandshrew."
gold_query = """
MATCH (s:PokemonSpecies)-[:HAS_ENCOUNTER]->(e:Encounter)-[:AT_LOCATION]->(:Location)
  -[:LOCATED_IN*0..1]->(l:Location {id: 'mt-moon'}),
  (e)-[:IN_VERSION]->(:Version)-[:PART_OF*]->(:Generation {id: 'generation-i'}),
  (s)-[:CAN_LEARN]->(m:Move {id: 'stealth-rock'})
RETURN DISTINCT s, l, m
"""

[[question]]
id = "Q30"
family = "S4"
question = "Which Water-type Pokémon that evolve from a Pokémon that learns Surf can also learn U-turn?"
reference = """8 species: Clawitzer, Lumineon, Greninja, Drizzile, Frogadier, Pelipper, Quaquaval \
and Inteleon."""
gold_query = """
MATCH (surf:Move {id: 'surf'})<-[:CAN_LEARN]-(:PokemonSpecies)-[:EVOLVES_TO]->(b:PokemonSpecies)-[:HAS_TYPE]->(:Type {id: 'water'}),
  (b)-[:CAN_LEARN]->(turn:Move {id: 'u-turn'})
RETURN DISTINCT surf, turn, b
"""
