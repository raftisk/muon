[[question]]
id = "N01"
family = "S5"
question = "which pokemon are found in mt coronet"
reference = """29 species, from Abomasnow to Zubat, including Bronzor, Feebas, Nosepass and Snover. \
The user writes an abbreviation in lower case with no punctuation; the graph names the location \
Mount Coronet."""
gold_query = """
MATCH (s:PokemonSpecies)-[:FOUND_IN]->(l:Location {id: 'mount-coronet'})
RETURN DISTINCT s, l
"""

[[question]]
id = "N02"
family = "S1"
question = "What type is Garchom?"
reference = """Garchomp is a Dragon and Ground type. The name has a typo."""
gold_query = """
MATCH (s:PokemonSpecies {id: 'garchomp'})-[:HAS_TYPE]->(t:Type)
RETURN s, t
"""

