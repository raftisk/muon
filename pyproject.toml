[project]
name = "muon"
version = "0.1.0"
description = "Multi-universe ontology and GraphRAG engine"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a live Neo4j"]
addopts = "-m 'not integration' --import-mode=importlib"
